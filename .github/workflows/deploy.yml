name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Build
        run: bun run build
        env:
          BETTER_AUTH_SECRET: build-time-only-placeholder

      - name: Ship to VPS
        timeout-minutes: 20
        env:
          SSH_KEY: ${{ secrets.DEPLOY_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          # Keepalives: npm/migrate print nothing for minutes while fetching,
          # and the tunnel/NAT path severs silent connections (~5 min idle).
          # These packets keep the channel alive through quiet phases.
          # (Unquoted $SSH_OPTS below is intentional word splitting.)
          SSH_OPTS="-i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15 -o ServerAliveCountMax=6"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "--- rsync to $VPS_HOST ---"
          rsync -az -e "ssh $SSH_OPTS" \
            --exclude node_modules --exclude .git --exclude .svelte-kit \
            --exclude data --exclude vault --exclude .opencode \
            --exclude '.env' --exclude '.env.*' \
            ./ "$VPS_USER@$VPS_HOST:/opt/scrinium/app/"
          echo "--- remote install/migrate/restart ---"
          ssh $SSH_OPTS \
            "$VPS_USER@$VPS_HOST" \
            'cd /opt/scrinium/app && \
             npm install --omit=dev --legacy-peer-deps && \
             npm install --prefix /opt/scrinium/app/.deploy-cli --no-save --omit=dev --legacy-peer-deps @better-auth/cli@1.4.21 && \
             echo "--- migrate as scrinium ---" && \
             sudo -u scrinium -H timeout --kill-after=10s 120s /opt/scrinium/app/.deploy-cli/node_modules/.bin/better-auth migrate --cwd /opt/scrinium/app --yes && \
             sudo systemctl restart scrinium.service && \
             sleep 2 && \
             systemctl is-active scrinium.service'
          echo "--- ship done ---"

      - name: Smoke test
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL secret not set - skipping smoke test"
            exit 0
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{}' \
            "$SITE_URL/api/auth/mobile")
          if [ "$status" = "404" ]; then
            echo "::error::auth/mobile endpoint missing on $SITE_URL (404)"
            exit 1
          fi
          echo "Smoke test passed (auth/mobile -> $status)"
