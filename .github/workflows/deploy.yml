name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Build
        run: bun run build
        env:
          BETTER_AUTH_SECRET: build-time-only-placeholder

      - name: Ship to VPS
        env:
          SSH_KEY: ${{ secrets.DEPLOY_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new" \
            --exclude node_modules --exclude .git --exclude .svelte-kit \
            --exclude data --exclude vault --exclude .opencode \
            --exclude '.env' --exclude '.env.*' \
            ./ "$VPS_USER@$VPS_HOST:/opt/scrinium/app/"
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            "$VPS_USER@$VPS_HOST" \
            'cd /opt/scrinium/app && \
             npm install --omit=dev --legacy-peer-deps && \
             sudo systemctl restart scrinium.service && \
             sleep 2 && \
             systemctl is-active scrinium.service'